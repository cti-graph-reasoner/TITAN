[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-cti"
version = "0.1.0"
description = "A typed, bidirectional knowledge graph framework for Cyber Threat Intelligence (CTI) reasoning and question answering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "networkx",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "accelerate",
    "datasets",
    "trl",
    "unsloth",
]
serve = [
    "vllm",
]

[tool.setuptools.packages.find]
include = ["titan*"]
